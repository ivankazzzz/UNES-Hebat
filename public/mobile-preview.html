<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Preview - Absensi Unes</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #0d1117;
    margin: 0;
    padding: 2vh;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  
  .header {
    color: #8b949e;
    margin-bottom: 2vh;
    font-size: clamp(12px, 2vh, 16px);
    font-weight: 500;
    flex-shrink: 0;
  }

  .device-frame {
    height: 100%;
    max-height: 844px;
    width: auto; 
    aspect-ratio: 390 / 844;
    border: clamp(8px, 1.5vh, 16px) solid #161b22;
    border-radius: clamp(24px, 4.5vh, 48px);
    position: relative;
    box-shadow: 0 0 0 2px #30363d, 0 15px 35px rgba(0, 0, 0, 0.5);
    background-color: #fff;
    overflow: hidden;
    flex-shrink: 1;
  }
  
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 33%;
    height: 3.5%;
    max-height: 30px;
    background-color: #161b22;
    border-bottom-left-radius: clamp(10px, 1.5vh, 16px);
    border-bottom-right-radius: clamp(10px, 1.5vh, 16px);
    z-index: 10;
  }
  
  @media (min-height: 500px) {
    .btn-silent { position: absolute; left: calc(-2% - 4px); top: 13%; width: 4px; height: 3%; background: #30363d; border-radius: 2px 0 0 2px; }
    .btn-vol-up { position: absolute; left: calc(-2% - 4px); top: 19%; width: 4px; height: 5.5%; background: #30363d; border-radius: 2px 0 0 2px; }
    .btn-vol-down { position: absolute; left: calc(-2% - 4px); top: 26%; width: 4px; height: 5.5%; background: #30363d; border-radius: 2px 0 0 2px; }
    .btn-power { position: absolute; right: calc(-2% - 4px); top: 21%; width: 4px; height: 8.5%; background: #30363d; border-radius: 0 2px 2px 0; }
  }
  
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    padding-top: max(4%, 10px);
    box-sizing: border-box;
    background: #f8f9fa;
  }
</style>
</head>
<body>
  <div class="header">📱 Pratinjau Tampilan Smartphone</div>
  <div class="device-frame">
    <div class="btn-silent"></div>
    <div class="btn-vol-up"></div>
    <div class="btn-vol-down"></div>
    <div class="btn-power"></div>
    <div class="notch"></div>
    <iframe src="/"></iframe>
  </div>
</body>
</html>
